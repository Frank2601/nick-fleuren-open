<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick Fleuren Open – Programma &amp; uitslagen</title>
<meta name="description" content="Programma en uitslagen van het Nick Fleuren Open bij TeVeR Rijkevoort.">
<link rel="icon" href="tever-logo.png">
<style>
  :root {
    --blauw: #2850a0; --blauw-licht: #6ea0e0; --blauw-zacht: #eaf0fa;
    --tekst: #1c2430; --grijs: #6b7785; --lijn: #e1e6ec; --achtergrond: #f4f6f9;
    --live: #1f9d55; --live-zacht: #e6f6ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--achtergrond); color: var(--tekst);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; line-height: 1.4; }

  header { background: var(--blauw); color: #fff; }
  .kop { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .kop img { height: 48px; background: #fff; padding: 4px 8px; border-radius: 6px; }
  .kop h1 { font-size: 1.35rem; line-height: 1.2; }
  .kop .sub { font-size: .9rem; opacity: .85; }

  .balk { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--lijn);
    box-shadow: 0 2px 6px rgba(0,0,0,.04); }
  .balk-in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: grid; gap: 10px; }
  .dagen { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .dagen::-webkit-scrollbar { display: none; }
  .dagen button { flex: 0 0 auto; border: 1px solid var(--lijn); background: #fff; color: var(--tekst);
    border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; white-space: nowrap; }
  .dagen button.actief { background: var(--blauw); border-color: var(--blauw); color: #fff; font-weight: 600; }
  .dagen.alle-dagen button.actief { background: #fff; border-color: var(--lijn); color: var(--tekst); font-weight: 400; }
  .dagen button .vandaag { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; margin-left: 4px; opacity: .8; }
  .filters { display: flex; gap: 8px; }
  .filters select, .filters input { font: inherit; font-size: .95rem; padding: 8px 10px; border: 1px solid var(--lijn);
    border-radius: 8px; background: #fff; color: var(--tekst); min-width: 0; }
  .filters select { flex: 0 1 40%; }
  .filters input { flex: 1; }

  main { max-width: 820px; margin: 0 auto; padding: 8px 16px 40px; }
  h2 { font-size: 1rem; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2 .aantal { font-weight: 400; color: var(--grijs); font-size: .9rem; }
  h3.tijdblok { font-size: .85rem; color: var(--grijs); font-weight: 600; margin: 14px 0 6px; }
  .punt { width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: puls 1.6s infinite; }
  @keyframes puls { 50% { opacity: .3; } }

  .kaart { background: #fff; border: 1px solid var(--lijn); border-left: 4px solid var(--lijn);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .kaart.bezig { border-left-color: var(--live); background: linear-gradient(90deg, var(--live-zacht), #fff 40%); }
  .kaart.gespeeld { border-left-color: var(--blauw-licht); }
  .kaart .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: var(--grijs); margin-bottom: 4px; }
  .kaart .meta b { color: var(--blauw); font-weight: 600; }
  .kaart .live { color: var(--live); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  /* Teams met de games per set erachter, als op een scorebord (altijd ruimte voor 3 sets) */
  .kaart .teams { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 1.7em); column-gap: 2px; align-items: center; }
  .kaart .teams.zonder-uitslag { grid-template-columns: minmax(0, 1fr); }
  .kaart .teams .naam { grid-column: 1; overflow-wrap: anywhere; padding-right: 6px; }
  .kaart .teams .set { text-align: center; font-variant-numeric: tabular-nums; color: var(--grijs); }
  .kaart .teams .set.won { color: var(--tekst); font-weight: 700; }
  .kaart .teams .tekst { grid-column: 2 / -1; grid-row: 1 / 3; text-align: right; font-weight: 700; white-space: nowrap; }
  .kaart .winnaar { font-weight: 700; }
  .kaart .winnaar::after { content: " ✓"; color: var(--live); }
  .kaart .verliezer { color: var(--grijs); }
  mark { background: #fff1a8; color: inherit; border-radius: 2px; }

  .leeg { text-align: center; color: var(--grijs); padding: 40px 0; }
  footer { max-width: 820px; margin: 0 auto; padding: 0 16px 30px; font-size: .8rem; color: var(--grijs);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
  footer a { color: var(--blauw); }
  .fout { color: #b3412a; }
</style>
</head>
<body>
<header>
  <div class="kop">
    <img src="tever-logo.png" alt="TeVeR Rijkevoort">
    <div>
      <h1 id="titel">Nick Fleuren Open</h1>
      <div class="sub" id="sub">TeVeR Rijkevoort · programma &amp; uitslagen</div>
    </div>
  </div>
</header>

<div class="balk">
  <div class="balk-in">
    <div class="dagen" id="dagen"></div>
    <div class="filters">
      <select id="onderdeel" aria-label="Onderdeel"><option value="">Alle onderdelen</option></select>
      <input id="zoek" type="search" placeholder="Zoek speler…" aria-label="Zoek speler">
    </div>
  </div>
</div>

<main id="main"><div class="leeg">Laden…</div></main>

<footer>
  <span id="status">&nbsp;</span>
  <span>Een website van TeVeR Rijkevoort</span>
</footer>

<script src="config.js?v=5"></script>
<script src="data.js?v=5"></script>
<script>
const CFG = window.TOERNOOI || {};
const VERVERS_SECONDEN = 60;
const DAGNAMEN = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const MAANDEN = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

const staat = { alle: [], dag: null, onderdeel: "", zoek: "" };

function dagLabel(datum) {
  const [d, m, j] = datum.split("-").map(Number);
  const dt = new Date(j, m - 1, d);
  return `${DAGNAMEN[dt.getDay()]} ${d} ${MAANDEN[m - 1]}`;
}

// Hoogt de zoekterm op in een (al ge-escapete) naam
function markeer(tekst) {
  const veilig = esc(tekst);
  if (!staat.zoek) return veilig;
  const q = esc(staat.zoek).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return veilig.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`);
}

function kaartHTML(w, metTijd) {
  const win = w.winnaar === "1" ? 1 : w.winnaar === "2" ? 2 : 0;
  const cls = n => win ? (win === n ? "winnaar" : "verliezer") : "";
  const meta = [
    w.status === "bezig" ? `<span class="live">● Bezig</span>` : "",
    metTijd && w.tijd ? `<span>${esc(w.tijd)}</span>` : "",
    `<b>${esc(w.onderdeel)}</b>`,
    w.ronde ? `<span>${esc(w.ronde)}</span>` : "",
    w.baan ? `<span>Baan ${esc(w.baan)}</span>` : "",
  ].filter(Boolean).join("");
  // Per team een regel: naam, daarachter de games per set (gewonnen set vet)
  const s = sets(w.uitslag);
  const regel = (n, naam) => `<div class="naam ${cls(n)}" style="grid-row:${n}">${markeer(naam)}</div>` +
    (s || []).map(([a, b], i) => {
      const eigen = n === 1 ? a : b, ander = n === 1 ? b : a;
      return `<div class="set${eigen > ander ? " won" : ""}" style="grid-row:${n};grid-column:${i + 2}">${eigen}</div>`;
    }).join("");
  // Afwijkende uitslag (bijv. walkover): als tekst rechts naast de namen
  const tekst = uitslagTekst(w) ? `<div class="tekst">${esc(uitslagTekst(w))}</div>` : "";
  return `<div class="kaart ${w.status}">
    <div class="meta">${meta}</div>
    <div class="teams${s || tekst ? "" : " zonder-uitslag"}">${regel(1, w.speler1)}${regel(2, w.speler2)}${tekst}</div>
  </div>`;
}

function filter(lijst) {
  const q = staat.zoek.toLowerCase();
  return lijst.filter(w =>
    (!staat.onderdeel || w.onderdeel === staat.onderdeel) &&
    (!q || `${w.speler1} ${w.speler2}`.toLowerCase().includes(q)));
}

function toonDagen() {
  const dagen = [...new Set(staat.alle.map(w => w.datum).filter(Boolean))]
    .sort((a, b) => datumSleutel(a).localeCompare(datumSleutel(b)));
  if (!dagen.includes(staat.dag)) {
    // Standaard: vandaag, anders de eerstvolgende speeldag, anders de laatste
    const nu = datumSleutel(vandaag());
    staat.dag = dagen.find(d => datumSleutel(d) >= nu) || dagen[dagen.length - 1] || null;
  }
  const el = document.getElementById("dagen");
  el.innerHTML = dagen.map(d => `<button data-dag="${d}" class="${d === staat.dag ? "actief" : ""}">${dagLabel(d)}${d === vandaag() ? `<span class="vandaag">vandaag</span>` : ""}</button>`).join("");
  el.querySelector(".actief")?.scrollIntoView({ inline: "center", block: "nearest" });
}

function toonOnderdelen() {
  const sel = document.getElementById("onderdeel");
  const opties = [...new Set(staat.alle.map(w => w.onderdeel).filter(Boolean))].sort((a, b) => a.localeCompare(b, "nl"));
  if (staat.onderdeel && !opties.includes(staat.onderdeel)) staat.onderdeel = "";
  sel.innerHTML = `<option value="">Alle onderdelen</option>` +
    opties.map(o => `<option${o === staat.onderdeel ? " selected" : ""}>${esc(o)}</option>`).join("");
}

function toon() {
  const main = document.getElementById("main");
  // Bij zoeken op naam of kiezen van een onderdeel: alle dagen tonen, zodat je de hele poule ziet
  const zoektAlles = !!(staat.zoek || staat.onderdeel);
  document.getElementById("dagen").classList.toggle("alle-dagen", zoektAlles);
  const lijst = filter(staat.alle.filter(w => zoektAlles || !staat.dag || w.datum === staat.dag));
  if (!lijst.length) {
    main.innerHTML = `<div class="leeg">${staat.alle.length ? "Geen wedstrijden gevonden." : "Nog geen wedstrijden."}</div>`;
    return;
  }

  let html = "";
  if (zoektAlles) {
    const perDag = new Map();
    lijst.sort((a, b) => datumSleutel(a.datum || "").localeCompare(datumSleutel(b.datum || "")) || tijdSleutel(a.tijd) - tijdSleutel(b.tijd))
      .forEach(w => { const k = w.datum || ""; if (!perDag.has(k)) perDag.set(k, []); perDag.get(k).push(w); });
    const gespeeld = lijst.filter(w => w.status === "gespeeld").length;
    html += staat.zoek
      ? `<h2>Zoekresultaat <span class="aantal">${lijst.length} wedstrijd${lijst.length === 1 ? "" : "en"}</span></h2>`
      : `<h2>${esc(staat.onderdeel)} <span class="aantal">${gespeeld}/${lijst.length} gespeeld</span></h2>`;
    for (const [dag, ws] of perDag) {
      html += `<h3 class="tijdblok">${dag ? dagLabel(dag) : ""}</h3>` + ws.map(w => kaartHTML(w, true)).join("");
    }
  } else {
    const bezig = lijst.filter(w => w.status === "bezig").sort((a, b) => (+a.baan || 99) - (+b.baan || 99));
    if (bezig.length) {
      html += `<h2><span class="punt"></span>Nu bezig <span class="aantal">${bezig.length}</span></h2>` +
        bezig.map(w => kaartHTML(w, true)).join("");
    }
    // Volledig dagprogramma, gegroepeerd per aanvangstijd
    const gesorteerd = lijst.filter(w => w.status !== "bezig")
      .sort((a, b) => tijdSleutel(a.tijd) - tijdSleutel(b.tijd) || a.volgnr - b.volgnr);
    if (gesorteerd.length) {
      const gespeeld = gesorteerd.filter(w => w.status === "gespeeld").length;
      html += `<h2>Programma ${staat.dag ? dagLabel(staat.dag) : ""} <span class="aantal">${gespeeld}/${gesorteerd.length} gespeeld</span></h2>`;
      let vorige = null;
      for (const w of gesorteerd) {
        if (w.tijd !== vorige) { html += `<h3 class="tijdblok">${esc(w.tijd || "Tijd onbekend")}</h3>`; vorige = w.tijd; }
        html += kaartHTML(w, false);
      }
    }
  }
  main.innerHTML = html;
}

async function laad() {
  const status = document.getElementById("status");
  try {
    const { wedstrijden, bijgewerkt } = await laadWedstrijden(CFG.CSV_URL);
    staat.alle = wedstrijden;
    toonDagen(); toonOnderdelen(); toon();
    status.className = "";
    status.textContent = bijgewerkt ? `Laatst bijgewerkt: ${bijgewerkt}` : "";
  } catch (e) {
    status.className = "fout";
    status.textContent = "Bijwerken mislukt, probeer het later opnieuw.";
    if (!staat.alle.length) document.getElementById("main").innerHTML = `<div class="leeg">Wedstrijden konden niet geladen worden.</div>`;
  }
}

document.getElementById("dagen").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  // Een dag kiezen = terug naar het dagprogramma: zoekterm en onderdeel wissen
  staat.dag = b.dataset.dag; staat.zoek = ""; staat.onderdeel = "";
  document.getElementById("zoek").value = ""; document.getElementById("onderdeel").value = "";
  toonDagen(); toon();
});
document.getElementById("onderdeel").addEventListener("change", e => { staat.onderdeel = e.target.value; toon(); });
document.getElementById("zoek").addEventListener("input", e => { staat.zoek = e.target.value.trim(); toon(); });

if (CFG.NAAM) document.getElementById("titel").textContent = CFG.NAAM;
laad();
setInterval(laad, VERVERS_SECONDEN * 1000);
</script>
</body>
</html>
